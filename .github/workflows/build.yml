name: Build Flutter Android AAB
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Project Dependencies
        run: flutter pub get

      # This creates the missing file in the correct 'services' folder before building
      - name: Create Missing AppEnv File
        run: |
          mkdir -p lib/services
          echo "class AppEnv { static const geminiApiKey = 'mock_key'; static const huggingFaceApiKey = 'mock_key'; }" > lib/services/app_env.dart

      - name: Build Unsigned App Bundle (.aab)
        run: flutter build appbundle --no-shrink

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-aab
          path: build/app/outputs/bundle/release/*.aab
