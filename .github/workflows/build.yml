name: Build Flutter Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up Java 17
      # --------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # --------------------------------------------------
      # 3. Set up Flutter
      # --------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --------------------------------------------------
      # 4. Check Flutter and Dart versions
      # --------------------------------------------------
      - name: Check Flutter Version
        run: |
          flutter --version
          dart --version

      # --------------------------------------------------
      # 5. Install dependencies
      # --------------------------------------------------
      - name: Install Project Dependencies
        run: |
          flutter pub get

      # --------------------------------------------------
      # 6. Create AppEnv file
      # --------------------------------------------------
      - name: Create AppEnv File
        run: |
          mkdir -p lib/core/config

          cat > lib/core/config/app_env.dart <<'EOF'
          class AppEnv {
            static const geminiApiKey =
                String.fromEnvironment(
                  'GEMINI_KEY',
                  defaultValue: 'mock_key',
                );

            static const huggingFaceApiKey =
                String.fromEnvironment(
                  'HF_KEY',
                  defaultValue: 'mock_key',
                );

            static const mongoDbUri =
                String.fromEnvironment(
                  'MONGODB_URI',
                  defaultValue: '',
                );
          }
          EOF

      # --------------------------------------------------
      # 7. Restore release keystore
      # --------------------------------------------------
      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          if [ ! -f android/app/upload-keystore.jks ]; then
            echo "ERROR: Release keystore was not created."
            exit 1
          fi

          echo "Release keystore restored successfully."

      # --------------------------------------------------
      # 8. Check keystore file
      # --------------------------------------------------
      - name: Verify Release Keystore
        run: |
          ls -lh android/app/upload-keystore.jks

      # --------------------------------------------------
      # 9. Clean previous Flutter build
      # --------------------------------------------------
      - name: Flutter Clean
        run: flutter clean

      # --------------------------------------------------
      # 10. Get dependencies again
      # --------------------------------------------------
      - name: Flutter Pub Get
        run: flutter pub get

      # --------------------------------------------------
      # 11. Analyze project
      # --------------------------------------------------
      - name: Flutter Analyze
        run: flutter analyze
        continue-on-error: true

      # --------------------------------------------------
      # 12. Build SIGNED Android App Bundle
      # --------------------------------------------------
      - name: Build Signed Android App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle \
            --release \
            --no-shrink \
            --dart-define=GEMINI_KEY=mock_key \
            --dart-define=HF_KEY=mock_key \
            --dart-define=MONGODB_URI=""

      # --------------------------------------------------
      # 13. Verify AAB
      # --------------------------------------------------
      - name: Verify AAB
        run: |
          echo "========================================"
          echo "Checking generated AAB..."
          echo "========================================"

          ls -lh build/app/outputs/bundle/release/

          if [ ! -f build/app/outputs/bundle/release/app-release.aab ]; then
            echo "ERROR: AAB was not generated."
            exit 1
          fi

          echo "========================================"
          echo "SIGNED AAB generated successfully!"
          echo "========================================"

      # --------------------------------------------------
      # 14. Upload AAB
      # --------------------------------------------------
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeVaultAI-Signed-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 15. Remove temporary keystore
      # --------------------------------------------------
      - name: Remove Temporary Keystore
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks
